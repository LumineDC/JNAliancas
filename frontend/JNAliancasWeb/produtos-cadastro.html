<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de produtos – JN Alianças</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="cadastro" data-entity="produtos">
<a class="pular" href="#conteudo">Ir para o conteúdo</a>
<header class="topo"><div class="topo-in"><a class="marca" href="menu.html"><svg width="42" height="28" viewBox="0 0 48 32" aria-hidden="true"><circle cx="17" cy="16" r="11" fill="none" stroke="#E1A253" stroke-width="3.5"/><circle cx="31" cy="16" r="11" fill="none" stroke="#F3D9A4" stroke-width="3.5"/></svg><span>JN Alianças</span></a><nav aria-label="Módulos"><a href="produtos.html" aria-current="page">Produtos</a><a href="clientes.html">Clientes</a><a href="pedidos.html">Pedidos</a><a href="estoque.html">Estoque</a><a href="agendamentos.html">Agendamento</a><a href="busca.html">Busca</a><a href="vendas.html">Vendas</a><a href="pagamentos.html">Pagamento</a><a href="entregas.html">Entrega</a></nav><a class="sair" href="index.html" data-sair>Sair</a></div></header>
<main id="conteudo" class="pagina">
<div class="titulo"><p class="trilha"><a href="menu.html">Início</a> / <a href="produtos.html">Produtos</a></p><h1>Cadastro de produtos</h1></div>
<section class="cartao"><h2>Informe os dados abaixo:</h2>
<form id="f" novalidate data-ok="Produto cadastrado com sucesso!" data-lista="produtos-lista.html">
<div class="grade">
<div class="campo"><label for="nome">Nome do Produto <span class="req" aria-hidden="true">*</span></label><input id="nome" name="nome" type="text" autocomplete="off" data-v="nome" required></div>
<div class="campo"><label for="material">Material <span class="req" aria-hidden="true">*</span></label><input id="material" name="material" type="text" autocomplete="off" required></div>
<div class="campo"><label for="quantidade">Quantidade <span class="req" aria-hidden="true">*</span></label><input id="quantidade" name="quantidade" type="text" autocomplete="off" data-v="qtd" required></div>
<div class="campo"><label for="preco">Preço <span class="req" aria-hidden="true">*</span></label><input id="preco" name="preco" type="text" autocomplete="off" data-v="preco" placeholder="00.00" required></div>
<div class="campo"><label for="categoria">Categoria <span class="req" aria-hidden="true">*</span></label><input id="categoria" name="categoria" type="text" autocomplete="off" required></div>
<div class="campo"><label for="observacoes">Observações</label><input id="observacoes" name="observacoes" type="text" autocomplete="off"></div>
</div>
<p class="nota">*Campo obrigatório</p>
<div class="acoes"><button class="btn" id="salvar">Salvar</button><a class="btn claro" href="produtos.html">Voltar</a></div>
</form></section>
</main>
<footer class="rodape-site">JN Alianças · Sistema de vendas</footer>
<script src="js/app.js"></script>
</body>
</html>
