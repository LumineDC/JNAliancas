<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de clientes – JN Alianças</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="cadastro" data-entity="clientes">
<a class="pular" href="#conteudo">Ir para o conteúdo</a>
<header class="topo"><div class="topo-in"><a class="marca" href="menu.html"><svg width="42" height="28" viewBox="0 0 48 32" aria-hidden="true"><circle cx="17" cy="16" r="11" fill="none" stroke="#E1A253" stroke-width="3.5"/><circle cx="31" cy="16" r="11" fill="none" stroke="#F3D9A4" stroke-width="3.5"/></svg><span>JN Alianças</span></a><nav aria-label="Módulos"><a href="produtos.html">Produtos</a><a href="clientes.html" aria-current="page">Clientes</a><a href="pedidos.html">Pedidos</a><a href="estoque.html">Estoque</a><a href="agendamentos.html">Agendamento</a><a href="busca.html">Busca</a><a href="vendas.html">Vendas</a><a href="pagamentos.html">Pagamento</a><a href="entregas.html">Entrega</a></nav><a class="sair" href="index.html" data-sair>Sair</a></div></header>
<main id="conteudo" class="pagina">
<div class="titulo"><p class="trilha"><a href="menu.html">Início</a> / <a href="clientes.html">Clientes</a></p><h1>Cadastro de clientes</h1></div>
<section class="cartao"><h2>Informe os dados abaixo:</h2>
<form id="f" novalidate data-ok="Cliente cadastrado com sucesso!" data-lista="clientes-lista.html">
<div class="grade">
<div class="campo"><label for="nome">Nome <span class="req" aria-hidden="true">*</span></label><input id="nome" name="nome" type="text" autocomplete="off" data-v="nome" required></div>
<div class="campo"><label for="nascimento">Data de Nascimento <span class="req" aria-hidden="true">*</span></label><input id="nascimento" name="nascimento" type="text" autocomplete="off" data-v="data" placeholder="dd/mm/aaaa" required></div>
<div class="campo"><label for="cpf">CPF <span class="req" aria-hidden="true">*</span></label><input id="cpf" name="cpf" type="text" autocomplete="off" data-v="cpf" placeholder="000.000.000-00" required></div>
<div class="campo"><label for="telefone">Telefone <span class="req" aria-hidden="true">*</span></label><input id="telefone" name="telefone" type="text" autocomplete="off" data-v="tel" placeholder="+55 (00) 00000-0000" required></div>
</div>
<fieldset><legend>Endereço</legend><div class="grade"><div class="campo"><label for="rua">Rua <span class="req" aria-hidden="true">*</span></label><input id="rua" name="rua" type="text" autocomplete="off" required></div>
<div class="campo"><label for="numero">Número <span class="req" aria-hidden="true">*</span></label><input id="numero" name="numero" type="text" autocomplete="off" data-v="numero" required></div>
<div class="campo"><label for="bairro">Bairro <span class="req" aria-hidden="true">*</span></label><input id="bairro" name="bairro" type="text" autocomplete="off" required></div>
<div class="campo"><label for="cidade">Cidade <span class="req" aria-hidden="true">*</span></label><input id="cidade" name="cidade" type="text" autocomplete="off" data-v="cidade" required></div>
<div class="campo"><label for="estado">Estado <span class="req" aria-hidden="true">*</span></label><input id="estado" name="estado" type="text" autocomplete="off" data-v="estado" placeholder="ex: MG" required maxlength="2"></div>
<div class="campo"><label for="cep">CEP <span class="req" aria-hidden="true">*</span></label><input id="cep" name="cep" type="text" autocomplete="off" data-v="cep" placeholder="00000-000" required></div>
<div class="campo"><label for="complemento">Complemento</label><input id="complemento" name="complemento" type="text" autocomplete="off"></div></div></fieldset>
<p class="nota">*Campo obrigatório</p>
<div class="acoes"><button class="btn" id="salvar">Salvar</button><a class="btn claro" href="clientes.html">Voltar</a></div>
</form></section>
</main>
<footer class="rodape-site">JN Alianças · Sistema de vendas</footer>
<script src="js/app.js"></script>
</body>
</html>
